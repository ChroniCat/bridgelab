<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0c"><title data-zh="桥梁巡检相机 · BridgeLab">Inspection camera · BridgeLab</title>
  <script src="../preferences.js"></script><link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="./mobile.css?v=wb6">
</head>
<body>
  <main id="camera-shell" aria-label="Inspection camera" data-zh-aria="巡检相机">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="joint-overlay" aria-hidden="true"></canvas>
    <p class="sr-only" id="model-location-status" role="status" aria-live="polite"></p>
    <header class="camera-top">
      <a id="leave" class="round" href="./index.html?v=wb5" aria-label="Return to desktop experiment" data-zh-aria="返回电脑实验"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></a>
      <div class="clock" id="clock"><span class="rec-dot" aria-hidden="true"></span><time id="timer">00:00</time></div>
      <button class="round" id="settings" type="button" aria-haspopup="dialog" aria-label="Camera options" data-zh-aria="相机选项"><svg viewBox="0 0 24 24"><path d="M3 7h9m4 0h5M3 17h3m4 0h11"/><circle cx="14" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></button>
    </header>
    <div id="alert-toast" role="alert" hidden><b id="alert-title"></b><span id="alert-detail"></span></div>
    <section id="prompt" class="prompt" aria-live="polite"><h1 id="prompt-title"></h1><p id="prompt-body"></p></section>
    <div class="camera-bottom">
      <div id="observation" role="status" data-state="opening"><span class="signal-dot" aria-hidden="true"></span><span id="tracking-state"></span><span id="reading"></span></div>
      <p id="guidance"></p>
      <div class="shutter-row">
        <button class="aux" id="overlay-toggle" type="button" aria-pressed="true" aria-label="Toggle model and bridge position" data-zh-aria="显示或隐藏桥模和位置导航">
          <svg viewBox="0 0 24 24"><path d="m12 2 8.5 5v10L12 22l-8.5-5V7zM3.5 7 12 12l8.5-5M12 12v10"/></svg><span data-zh="模型">Model</span>
        </button>
        <div class="shutter-group"><button type="button" id="shutter"><span></span></button><span id="shutter-label"></span></div>
        <button class="aux" id="last-review" type="button" hidden><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span data-zh="上次总结">Last take</span></button>
      </div>
    </div>
  </main>
  <dialog id="options" aria-labelledby="options-title">
    <header><h2 id="options-title" data-zh="相机选项">Camera options</h2><button class="round close-option" type="button" id="options-close" aria-label="Close" data-zh-aria="关闭">×</button></header>
    <label class="setting"><span data-zh="用 GPS 估算实走距离">Estimate walking distance with GPS</span><input id="use-gps" type="checkbox"></label>
    <p data-zh="定位只在录制期间使用，室内可能无法取得可靠距离。">Location is used during recording. Indoor signals may be insufficient.</p>
    <a id="mode-link" href="./mobile.html?site=waibaidu&amp;v=wb5"></a>
    <a id="baseline-link" href="../field/" hidden data-zh="设置现场基准">Set a field baseline</a>
    <div data-preferences class="pref-controls"></div>
  </dialog>
  <main id="review" hidden>
    <div class="review-wrap"><header class="review-head"><p data-zh="BridgeLab · 巡检录像">BridgeLab · Inspection recording</p><h1 data-zh="本次巡检总结">Inspection summary</h1><span id="review-date"></span></header>
      <dl class="stats" id="summary-stats"></dl>
      <section class="peak"><h2 data-zh="最大形变位置">Largest observed change</h2><p id="peak-description"></p><ol id="locations-list"></ol><small data-zh="位移按参考画面像素（px）计。">Displacement is measured in reference-image pixels (px).</small></section>
      <section id="film"><h2 data-zh="巡检录像">Recording</h2><video id="playback" controls playsinline preload="metadata" hidden></video><p id="film-note"></p>
        <div class="film-actions"><a id="save-film" class="action" download hidden data-zh="保存视频">Save video</a><button id="share-film" type="button" class="action" hidden data-zh="分享视频">Share video</button></div>
      </section>
      <button class="action new-take" id="new-take" type="button" data-zh="返回取景">Return to camera</button>
    </div>
  </main>
  <script type="module" src="./mobile.js?v=wb7"></script>
</body></html>
